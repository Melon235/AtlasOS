# Stage 3 variant P0: identity optimizer (Stage 2 stable baseline).

provider:
  name: deepseek
  model: deepseek-chat
  base_url: null
  api_key_env: DEEPSEEK_API_KEY

context:
  policy: task_scoped
  renderer: stable_deterministic
  optimizer:
    name: identity
    reorder: false
    deduplicate: false
  contextpilot_enabled: false

scheduler:
  policy: upstream_default

pricing: null
