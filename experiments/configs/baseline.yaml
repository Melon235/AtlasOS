# Baseline experiment configuration (Stage 1 / U0).
# No AtlasOS context optimization is enabled here: AnyCode builds the prompt.

provider:
  name: deepseek
  model: deepseek-chat
  base_url: null
  api_key_env: DEEPSEEK_API_KEY

context:
  policy: upstream_default
  renderer: upstream_default
  contextpilot_enabled: false
  contextpilot:
    reorder: true
    deduplicate: true

scheduler:
  policy: upstream_default

# Pricing is configuration-driven; fill in the snapshot you actually used.
# When pricing is absent, cost is null and token metrics still work.
pricing: null
