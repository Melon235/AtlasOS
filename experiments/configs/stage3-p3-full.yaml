# Stage 3 variant P3: official ContextPilot reorder + dedup.

provider:
  name: deepseek
  model: deepseek-chat
  base_url: null
  api_key_env: DEEPSEEK_API_KEY

context:
  policy: task_scoped
  renderer: stable_deterministic
  optimizer:
    name: contextpilot
    reorder: true
    deduplicate: true
  contextpilot_enabled: false

scheduler:
  policy: upstream_default

pricing: null
