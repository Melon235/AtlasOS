# Atlas V2 real coding UAT: trusted Atlas Sandbox selection.
#
# Provider, endpoint, image, workspace, network, and resource limits come from Host configuration
# only. Model output, tool arguments, and worker-profile text cannot change them.
sandbox:
  enabled: true
  provider: opensandbox
  endpoint: localhost:8080
  protocol: http
  # Local UAT image: Python 3.12 + Git (from the base image) + pytest. Built from
  # experiments/fixtures/uat_image/Dockerfile; selected by trusted Host configuration.
  image: atlas-uat-python:3.12
  workspace_root: /workspace/project
  network: none
  max_bundle_bytes: 67108864
  timeout_minutes: 20
  ready_timeout_seconds: 240
  cpu: "1"
  memory: "1Gi"
  use_server_proxy: true
  retain_on_failure: false
