# Stage 2 variant C2: task-scoped selection + stable deterministic rendering.
# Layout must not change when dependency completion order changes.

provider:
  name: deepseek
  model: deepseek-chat
  base_url: null
  api_key_env: DEEPSEEK_API_KEY

context:
  policy: task_scoped
  renderer: stable_deterministic
  contextpilot_enabled: false
  contextpilot:
    reorder: true
    deduplicate: true

scheduler:
  policy: upstream_default

pricing: null
