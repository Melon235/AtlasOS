name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline checks (no provider, no sandbox service)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The optional extras the offline suite actually imports: the local app tests need
          # fastapi/typer, the sandbox adapter tests need the OpenSandbox/Daytona clients.
          # mcp / contextpilot / sentence-transformers / faiss are guarded by pytest.importorskip.
          python -m pip install -e ".[dev,sandbox,app]"

      - name: Tests (live API tests are deselected by pytest addopts)
        run: python -m pytest

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Types
        run: python -m pyright
